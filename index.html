<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11151b"><link rel="manifest" href="manifest.json">
<title>MIXER by Sanusi 2.0</title>
<style>
:root{--bg:#101419;--panel:#1a2027;--panel2:#232b34;--line:#39434d;--gold:#e5b85c;--green:#7be0a2;--muted:#a6b0bb}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#35404a,#101419 58%);color:#f1f4f6;font:14px system-ui,Arial}
header{padding:18px 14px 12px;text-align:center;border-bottom:1px solid #39434d;background:linear-gradient(#252d36,#151a20);box-shadow:0 8px 24px #0008}
h1{margin:0;font-size:23px;letter-spacing:2px;color:#f1c66f;text-shadow:0 2px 8px #000}header p{margin:5px 0 0;color:#b4bec8;font-size:11px;letter-spacing:1.4px}
main{max-width:1100px;margin:auto;padding:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button,.filebtn{border:1px solid #59636e;border-radius:8px;padding:10px 12px;color:#f6f7f8;background:linear-gradient(#39434d,#242c34);font-weight:650;cursor:pointer}
button:active,.filebtn:active{transform:translateY(1px)}.primary{background:linear-gradient(#e9c46d,#a8792d);color:#19140b;border-color:#f3d58b}
input[type=file]{display:none}.status{color:var(--muted);font-size:12px;margin:8px 0}
.master{background:linear-gradient(145deg,#28313a,#171d23);border:1px solid #59636e;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:inset 0 1px #ffffff12,0 8px 20px #0005}
h2{font-size:13px;letter-spacing:1.3px;color:#f0c66e;margin:0 0 12px;text-transform:uppercase}
.masterrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}.control{background:#11171d;border:1px solid #35404a;border-radius:9px;padding:10px}
.control label{display:flex;justify-content:space-between;color:#cbd3da;font-size:12px;margin-bottom:8px}
input[type=range]{width:100%;accent-color:#e6bd64}
.meter{height:9px;border-radius:9px;background:#080c10;overflow:hidden;margin-top:7px;border:1px solid #43505a}.meter span{display:block;width:0;height:100%;background:linear-gradient(90deg,#42c879,#e5d45c,#e85d4c)}
.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px}
.channel{background:linear-gradient(145deg,#303943,#171d23 65%);border:1px solid #58636e;border-radius:11px;padding:10px;box-shadow:inset 0 1px #ffffff18,0 6px 14px #0005;min-width:0}
.chhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.chname{font-weight:800;color:#f4d18a;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.led{width:8px;height:8px;border-radius:50%;background:#53d58a;box-shadow:0 0 8px #53d58a}
.trackname{font-size:11px;color:#d2d9df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px;margin-bottom:7px}
.miniBtns{display:flex;gap:5px;margin:8px 0}.miniBtns button{flex:1;padding:7px 4px;font-size:10px}.on{background:linear-gradient(#d9b55f,#876326);color:#17120a}
.knobrow{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.knob{background:#11171d;border:1px solid #3d4852;border-radius:7px;padding:6px 3px;text-align:center}.knob label{display:block;font-size:9px;color:#aeb9c3;margin-bottom:3px}.knob input{width:100%;margin:0}.knob b{font-size:9px;color:#e9c875}
.faderbox{display:flex;align-items:center;justify-content:center;gap:10px;background:#11171d;border:1px solid #3d4852;border-radius:8px;padding:8px;margin-top:8px;height:132px}
.faderbox input{height:110px;width:28px;writing-mode:vertical-lr;direction:rtl;accent-color:#e4bd67}
.faderlabel{font-size:10px;color:#aeb9c3;line-height:1.7;text-align:left}
.transport{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.transport button{flex:1;min-width:70px}
.section{margin:14px 0}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
footer{text-align:center;color:#7f8b96;font-size:11px;padding:20px}
@media(min-width:700px){.deck{grid-template-columns:repeat(4,minmax(0,1fr))}.masterrow{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body>
<header><h1>MIXER <span style="color:#fff">by Sanusi</span></h1><p>VIRTUAL AUDIO STUDIO • MIXING CONSOLE 2.0</p></header>
<main>
<div class="toolbar">
<label class="filebtn primary" for="files">＋ TAMBAH AUDIO</label><input id="files" type="file" accept="audio/*" multiple>
<button id="playAll">▶ PUTAR</button><button id="pauseAll">Ⅱ JEDA</button><button id="stopAll">■ STOP</button>
<button id="record">● REKAM MIX</button><button id="download" disabled>↓ UNDUH</button>
</div>
<div class="status" id="status">Pilih satu atau beberapa file audio dari perangkat Anda.</div>
<section class="master">
<h2>MASTER SECTION</h2>
<div class="masterrow">
<div class="control"><label>MASTER VOLUME <b id="masterVal">85%</b></label><input id="master" type="range" min="0" max="100" value="85"><div class="meter"><span id="masterMeter"></span></div></div>
<div class="control"><label>MASTER PAN <b id="panVal">CENTER</b></label><input id="masterPan" type="range" min="-100" max="100" value="0"></div>
<div class="control"><label>LOW / BASS <b id="bassVal">0 dB</b></label><input id="bass" type="range" min="-12" max="12" value="0"></div>
<div class="control"><label>HIGH / TREBLE <b id="trebleVal">0 dB</b></label><input id="treble" type="range" min="-12" max="12" value="0"></div>
</div>
<div class="transport"><button id="muteMaster">MASTER MUTE</button><button id="reset">RESET MIX</button></div>
</section>
<div class="section"><div class="sectionhead"><h2>INPUT CHANNELS</h2><span style="font-size:10px;color:#a6b0bb">GAIN • PAN • EQ • FADER</span></div><div class="deck" id="deck"></div></div>
<footer>MIXER by Sanusi 2.0 • Audio diproses langsung di browser perangkat Anda.</footer>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let tracks=[],ctx=null,master=null,masterPan=null,bass=null,treble=null,recorder=null,chunks=[],recordUrl='',muted=false;
function engine(){if(ctx)return;let AC=window.AudioContext||window.webkitAudioContext;if(!AC){$('status').textContent='Browser tidak mendukung Web Audio API.';return}
ctx=new AC();master=ctx.createGain();masterPan=ctx.createStereoPanner();bass=ctx.createBiquadFilter();bass.type='lowshelf';bass.frequency.value=180;treble=ctx.createBiquadFilter();treble.type='highshelf';treble.frequency.value=4500;let comp=ctx.createDynamicsCompressor();master.connect(masterPan).connect(bass).connect(treble).connect(comp).connect(ctx.destination);master.gain.value=.85;}
function addFiles(list){engine();[...list].forEach((f)=>{let audio=new Audio();audio.src=URL.createObjectURL(f);audio.preload='metadata';let src=null,gain=null,pan=null,low=null,mid=null,high=null;if(ctx){src=ctx.createMediaElementSource(audio);gain=ctx.createGain();pan=ctx.createStereoPanner();low=ctx.createBiquadFilter();low.type='lowshelf';low.frequency.value=180;mid=ctx.createBiquadFilter();mid.type='peaking';mid.frequency.value=1000;mid.Q.value=.8;high=ctx.createBiquadFilter();high.type='highshelf';high.frequency.value=4500;src.connect(low).connect(mid).connect(high).connect(gain).connect(pan).connect(master);gain.gain.value=.8;}tracks.push({file:f,audio,gain,pan,low,mid,high,mute:false,solo:false});});render();$('status').textContent=tracks.length+' channel audio siap digunakan.';}
function render(){$('deck').innerHTML='';tracks.forEach((t,i)=>{let el=document.createElement('div');el.className='channel';el.innerHTML=`<div class="chhead"><span class="chname">CH ${String(i+1).padStart(2,'0')}</span><span class="led"></span></div><div class="trackname" title="${esc(t.file.name)}">${esc(t.file.name)}</div><div class="miniBtns"><button data-act="play">▶</button><button data-act="mute">MUTE</button><button data-act="solo">SOLO</button></div><div class="knobrow"><div class="knob"><label>LOW</label><input data-k="low" type="range" min="-12" max="12" value="0"><b>0 dB</b></div><div class="knob"><label>MID</label><input data-k="mid" type="range" min="-12" max="12" value="0"><b>0 dB</b></div><div class="knob"><label>HIGH</label><input data-k="high" type="range" min="-12" max="12" value="0"><b>0 dB</b></div></div><div class="control" style="margin-top:8px"><label>PAN <b>CENTER</b></label><input data-k="pan" type="range" min="-100" max="100" value="0"></div><div class="faderbox"><input data-k="vol" type="range" min="0" max="100" value="80"><div class="faderlabel">100<br>80<br>60<br>40<br>20<br>0<br><b>LEVEL</b></div></div>`;el.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.act==='play'){if(t.audio.paused)t.audio.play();else t.audio.pause();b.classList.toggle('on',!t.audio.paused)}if(b.dataset.act==='mute'){t.mute=!t.mute;b.classList.toggle('on',t.mute);applySolo()}if(b.dataset.act==='solo'){t.solo=!t.solo;b.classList.toggle('on',t.solo);applySolo()}});el.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{let v=+inp.value,k=inp.dataset.k;if(k==='vol'&&t.gain)t.gain.gain.value=v/100;if(k==='pan'&&t.pan)t.pan.pan.value=v/100;if(k==='low'&&t.low)t.low.gain.value=v;if(k==='mid'&&t.mid)t.mid.gain.value=v;if(k==='high'&&t.high)t.high.gain.value=v;let b=inp.parentElement.querySelector('b');if(b)b.textContent=k==='pan'?(v===0?'CENTER':v<0?'L '+Math.abs(v):'R '+v):v+' dB'});$('deck').append(el);});}
function applySolo(){let has=tracks.some(t=>t.solo);tracks.forEach(t=>{if(t.gain)t.gain.gain.value=(t.mute||(has&&!t.solo))?0:.8;});}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('files').onchange=e=>addFiles(e.target.files);$('playAll').onclick=()=>{engine();if(ctx)ctx.resume();tracks.forEach(t=>t.audio.play())};$('pauseAll').onclick=()=>tracks.forEach(t=>t.audio.pause());$('stopAll').onclick=()=>tracks.forEach(t=>{t.audio.pause();t.audio.currentTime=0});
$('master').oninput=e=>{let v=+e.target.value;$('masterVal').textContent=v+'%';if(master)master.gain.value=muted?0:v/100};$('masterPan').oninput=e=>{let v=+e.target.value;$('panVal').textContent=v===0?'CENTER':v<0?'L '+-v:'R '+v;if(masterPan)masterPan.pan.value=v/100};$('bass').oninput=e=>{let v=+e.target.value;$('bassVal').textContent=v+' dB';if(bass)bass.gain.value=v};$('treble').oninput=e=>{let v=+e.target.value;$('trebleVal').textContent=v+' dB';if(treble)treble.gain.value=v};
$('muteMaster').onclick=()=>{muted=!muted;$('muteMaster').classList.toggle('on',muted);if(master)master.gain.value=muted?0:+$('master').value/100};$('reset').onclick=()=>{tracks.forEach(t=>{if(t.gain)t.gain.gain.value=.8;if(t.pan)t.pan.pan.value=0;[t.low,t.mid,t.high].forEach(n=>{if(n)n.gain.value=0})});$('master').value=85;$('master').dispatchEvent(new Event('input'));$('bass').value=0;$('bass').dispatchEvent(new Event('input'));$('treble').value=0;$('treble').dispatchEvent(new Event('input'));$('masterPan').value=0;$('masterPan').dispatchEvent(new Event('input'));$('status').textContent='Pengaturan mixer direset.'};
$('record').onclick=async()=>{engine();if(!ctx||!tracks.length){$('status').textContent='Tambahkan audio terlebih dahulu.';return}try{await ctx.resume();let dest=ctx.createMediaStreamDestination();master.connect(dest);chunks=[];recorder=new MediaRecorder(dest.stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{if(recordUrl)URL.revokeObjectURL(recordUrl);recordUrl=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));$('download').disabled=false;$('status').textContent='Rekaman selesai. Tekan UNDUH untuk menyimpan.'};recorder.start();$('record').textContent='■ SELESAI REKAM';$('record').classList.add('on');$('record').onclick=()=>{recorder.stop();$('record').textContent='● REKAM MIX';$('record').classList.remove('on')};$('status').textContent='Sedang merekam output master.'}catch(e){$('status').textContent='Perekaman tidak didukung browser ini.'}};
$('download').onclick=()=>{if(!recordUrl)return;let a=document.createElement('a');a.href=recordUrl;a.download='MIXER-by-Sanusi-mix.webm';a.click()};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script></body></html>
