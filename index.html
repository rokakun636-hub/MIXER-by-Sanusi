<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<link rel="manifest" href="manifest.json">
<title>MIXER by Sanusi 5.0</title>
<style>
:root{--bg:#101820;--panel:#1a2630;--panel2:#243440;--line:#40515d;--text:#edf4f7;--muted:#9eafb9;--green:#49d17d;--amber:#ffbd4a;--red:#ff5b62}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0c1319,#1b2933);color:var(--text);font:14px system-ui,Arial,sans-serif}
header{padding:15px 16px;background:#0b1117;border-bottom:1px solid #34434d;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
.brand{font-weight:900;letter-spacing:1.5px;font-size:17px}.brand small{display:block;color:var(--green);font-size:10px;letter-spacing:2px}
button,.filebtn,select{background:#263944;color:#fff;border:1px solid #526571;border-radius:8px;padding:9px 11px;font-weight:700}
button:active{transform:scale(.97)}button.primary{background:#16834a;border-color:#38bd73}button.warn{background:#8b3438}
main{padding:12px;max-width:1500px;margin:auto}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.master{background:linear-gradient(135deg,#263943,#17232b);border:1px solid #52636d;border-radius:12px;padding:12px;margin-bottom:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;align-items:center}
.master h2{margin:0;font-size:15px}.control label{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}
input[type=range]{width:100%;accent-color:var(--green)}input[type=file]{display:none}
.meter{height:9px;background:#091015;border:1px solid #394b55;border-radius:10px;overflow:hidden}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#27bb68 0 65%,#e6c348 80%,#e64b4b);transition:width .08s}
#channels{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;align-items:stretch}
.channel{background:linear-gradient(180deg,#344651,#202d36 40%,#172129);border:1px solid #596b75;border-radius:10px;padding:10px;box-shadow:inset 0 1px #87959b,0 5px 14px #0005;min-width:0}
.ch-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #657680;padding-bottom:8px;margin-bottom:8px}
.ch-head strong{font-size:13px}.ch-head small{color:#b7c6cd}
.ch-meter{height:7px;background:#0a1014;border-radius:8px;overflow:hidden;margin:7px 0 10px}.ch-meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#36c978,#e6c348,#ee5555)}
.eq-title{text-align:center;font-size:10px;letter-spacing:2px;color:#b7c6cd;margin:8px 0 5px}
.eq{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.eq label{font-size:9px;text-align:center;color:#c1ccd1}.eq input{writing-mode:vertical-lr;direction:rtl;height:70px;width:100%;accent-color:#e7bd4c}
.fader-area{display:flex;gap:10px;justify-content:center;align-items:center;margin:12px 0}.fader{height:155px;width:28px;writing-mode:vertical-lr;direction:rtl;accent-color:#d7e2e7}
.fader-label{font-size:10px;color:#c4d0d6;text-align:center}
.pan{margin:8px 0}.pan label{display:flex;justify-content:space-between;color:#bdc9cf;font-size:10px}
.actions{display:flex;gap:5px;justify-content:center;margin-top:9px}.actions button{padding:7px 9px;font-size:10px}.active{background:#bd7e22!important;border-color:#ffd36c!important}
footer{text-align:center;color:#7f929d;padding:18px;font-size:11px}
@media(min-width:900px){#channels{grid-template-columns:repeat(6,minmax(150px,1fr))}}
</style>
</head>
<body>
<header><div class="brand">MIXER by Sanusi <small>PRO AUDIO MIXER · VERSION 5.0</small></div><div id="status">AUDIO ENGINE READY</div></header>
<main>
<div class="toolbar">
<label class="filebtn" for="audioFiles">＋ TAMBAH AUDIO</label><input id="audioFiles" type="file" accept="audio/*" multiple>
<button class="primary" id="playAll">▶ PLAY ALL</button><button id="stopAll">■ STOP</button>
<button id="addChannel">＋ CHANNEL</button><button id="recordBtn">● RECORD</button><button id="downloadRec" disabled>↓ SIMPAN</button>
<select id="preset"><option value="flat">Preset: Flat</option><option value="vocal">Vocal</option><option value="bass">Bass Boost</option><option value="bright">Bright</option></select>
</div>
<section class="master">
<div><h2>MASTER SECTION</h2><div class="meter"><span id="masterMeter"></span></div><small id="masterDb">OUTPUT −∞ dB</small></div>
<div class="control"><label>MASTER LEVEL <b id="masterVal">80%</b></label><input id="masterGain" type="range" min="0" max="100" value="80"></div>
<div class="control"><label>REVERB <b>0%</b></label><input type="range" min="0" max="100" value="0" disabled></div>
<div class="control"><label>DELAY <b>0%</b></label><input type="range" min="0" max="100" value="0" disabled></div>
<div class="control"><label>CHORUS <b>0%</b></label><input type="range" min="0" max="100" value="0" disabled></div>
</section>
<div id="channels"></div>
</main>
<footer>MIXER by Sanusi 5.0 · Gunakan file audio milik Anda. Efek reverb/delay/chorus ditampilkan sebagai kontrol rancangan dan belum memproses audio.</footer>
<script>
const ctx = new (window.AudioContext||window.webkitAudioContext)();
const master = ctx.createGain(), masterAnalyser=ctx.createAnalyser(), recordDest=ctx.createMediaStreamDestination();
master.gain.value=.8; master.connect(masterAnalyser); masterAnalyser.connect(ctx.destination); masterAnalyser.connect(recordDest);
masterAnalyser.fftSize=256;
let channels=[],recorder=null,recorded=[],recordUrl=null;
const $=id=>document.getElementById(id);
function makeChannel(name='CHANNEL '+(channels.length+1),file=null){
 const audio=new Audio(); audio.crossOrigin='anonymous'; if(file)audio.src=URL.createObjectURL(file);
 const source=ctx.createMediaElementSource(audio), filters=[60,150,400,1000,2400,6000,12000].map(f=>{let n=ctx.createBiquadFilter();n.type='peaking';n.frequency.value=f;n.Q.value=1;return n});
 const gain=ctx.createGain(),pan=ctx.createStereoPanner(),an=ctx.createAnalyser();an.fftSize=128;
 source.connect(filters[0]); for(let i=0;i<filters.length-1;i++)filters[i].connect(filters[i+1]);
 filters[6].connect(gain);gain.connect(pan);pan.connect(an);an.connect(master);
 const ch={name,audio,filters,gain,pan,an,mute:false,solo:false};channels.push(ch);render();return ch;
}
function render(){
 $('channels').innerHTML='';
 channels.forEach((c,i)=>{
 let el=document.createElement('section');el.className='channel';
 el.innerHTML=`<div class="ch-head"><strong>${c.name}</strong><small>CH ${i+1}</small></div>
 <input aria-label="Nama channel" value="${c.name}" style="width:100%;background:#152129;color:white;border:1px solid #52636d;border-radius:5px;padding:6px" class="rename">
 <div class="ch-meter"><span></span></div><div class="eq-title">7 BAND EQUALIZER</div>
 <div class="eq">${['60','150','400','1k','2.4k','6k','12k'].map((f,j)=>`<label>${f}<input type="range" min="-12" max="12" value="0" data-eq="${j}"><br>0</label>`).join('')}</div>
 <div class="fader-area"><div><div class="fader-label">PAN</div><input class="pan-knob" type="range" min="-100" max="100" value="0"></div><div><div class="fader-label">LEVEL</div><input class="fader" type="range" min="0" max="100" value="80"></div></div>
 <div class="fader-label levelText">80%</div><div class="actions"><button class="mute">MUTE</button><button class="solo">SOLO</button><button class="play">▶</button><button class="stop">■</button></div>
 <div style="margin-top:8px"><label class="filebtn">GANTI FILE<input class="replace" type="file" accept="audio/*"></label></div>`;
 const rename=el.querySelector('.rename');rename.onchange=()=>{c.name=rename.value;el.querySelector('.ch-head strong').textContent=c.name};
 el.querySelectorAll('[data-eq]').forEach(inp=>inp.oninput=()=>{c.filters[+inp.dataset.eq].gain.value=+inp.value;inp.parentElement.lastChild.textContent=inp.value});
 el.querySelector('.fader').oninput=e=>{c.gain.gain.value=e.target.value/100;el.querySelector('.levelText').textContent=e.target.value+'%'};
 el.querySelector('.pan-knob').oninput=e=>c.pan.pan.value=e.target.value/100;
 el.querySelector('.mute').onclick=e=>{c.mute=!c.mute;e.target.classList.toggle('active',c.mute);updateMutes()};
 el.querySelector('.solo').onclick=e=>{c.solo=!c.solo;e.target.classList.toggle('active',c.solo);updateMutes()};
 el.querySelector('.play').onclick=()=>{ctx.resume();c.audio.play()};
 el.querySelector('.stop').onclick=()=>{c.audio.pause();c.audio.currentTime=0};
 el.querySelector('.replace').onchange=e=>{if(e.target.files[0]){c.audio.src=URL.createObjectURL(e.target.files[0]);c.audio.load()}};
 $('channels').appendChild(el);
 });
}
function updateMutes(){let hasSolo=channels.some(c=>c.solo);channels.forEach(c=>c.gain.gain.value=(c.mute||(hasSolo&&!c.solo))?0:(c._level??.8))}
$('audioFiles').onchange=e=>{[...e.target.files].forEach(f=>{let c=makeChannel(f.name.replace(/\.[^.]+$/,''),f);c._level=.8});e.target.value=''};
$('addChannel').onclick=()=>makeChannel();
$('playAll').onclick=()=>{ctx.resume();channels.forEach(c=>c.audio.play())};
$('stopAll').onclick=()=>channels.forEach(c=>{c.audio.pause();c.audio.currentTime=0});
$('masterGain').oninput=e=>{$('masterVal').textContent=e.target.value+'%';master.gain.value=e.target.value/100};
$('preset').onchange=e=>{let presets={flat:[0,0,0,0,0,0,0],vocal:[-2,-1,1,3,3,2,0],bass:[5,4,2,0,-1,-2,-2],bright:[-2,-1,0,1,2,4,5]};channels.forEach(c=>c.filters.forEach((f,i)=>f.gain.value=presets[e.target.value][i]));render()};
let data=new Uint8Array(masterAnalyser.frequencyBinCount);
function animate(){masterAnalyser.getByteFrequencyData(data);let v=Math.max(...data)/255;$('masterMeter').style.width=(v*100)+'%';$('masterDb').textContent='OUTPUT '+(v? (20*Math.log10(v)).toFixed(1):'−∞')+' dB';
 channels.forEach((c,i)=>{let a=new Uint8Array(c.an.frequencyBinCount);c.an.getByteFrequencyData(a);let m=Math.max(...a)/255;let el=$('channels').children[i];if(el)el.querySelector('.ch-meter span').style.width=(m*100)+'%'});requestAnimationFrame(animate)}
animate();
$('recordBtn').onclick=async()=>{await ctx.resume();if(recorder&&recorder.state==='recording'){recorder.stop();$('recordBtn').textContent='● RECORD';$('status').textContent='RECORDING STOPPED';return}
 recorded=[];recorder=new MediaRecorder(recordDest.stream);recorder.ondataavailable=e=>{if(e.data.size)recorded.push(e.data)};recorder.onstop=()=>{$('downloadRec').disabled=false;if(recordUrl)URL.revokeObjectURL(recordUrl);recordUrl=URL.createObjectURL(new Blob(recorded,{type:'audio/webm'}));$('status').textContent='RECORDING READY'};recorder.start();$('recordBtn').textContent='■ STOP REC';$('status').textContent='RECORDING...'};
$('downloadRec').onclick=()=>{if(!recordUrl)return;let a=document.createElement('a');a.href=recordUrl;a.download='MIXER-by-Sanusi-recording.webm';a.click()};
makeChannel('CHANNEL 1');makeChannel('CHANNEL 2');makeChannel('CHANNEL 3');makeChannel('CHANNEL 4');
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body></html>
